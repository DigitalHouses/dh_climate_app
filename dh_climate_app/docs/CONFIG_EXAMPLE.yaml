# DigitalHouses Climate App options example.
#
# Entity lists are comma-separated because Home Assistant App configuration
# schemas support only limited nesting depth. Order is priority where noted.

hysteresis: 0.5
humidity_hysteresis: 3.0

night_mode: input_boolean.night_mode
we_at_home: input_boolean.we_at_home

heat_threshold_default: 12.0
cool_threshold_default: 20.0

# Reversible climate devices configured in both FAST lists are treated as
# AC/heat-pump devices for the legacy cold-weather heating protection.
ac_min_outdoor_temperature: -10.0

# First currently valid entity wins.
outdoor_temperature_sources: >-
  sensor.outdoor_temperature,
  sensor.weather_station_temperature

# Humidity priority is independent from temperature priority.
outdoor_humidity_sources: >-
  sensor.outdoor_humidity,
  sensor.weather_station_humidity

rooms:
  - id: living_room
    name: Living room

    # Multiple room sensors are averaged.
    temperature_sensors: >-
      sensor.living_room_temperature

    humidity_sensors: >-
      sensor.living_room_humidity

    # Optional window contacts. Any open contact makes the room window state open.
    window_sensors: >-
      binary_sensor.living_room_window

    # Only listed thermal devices are forced off while a window is open.
    window_off_devices: >-
      climate.living_room_ac

    # Room air targets: room × season × profile.
    heat_day: 23.0
    heat_night: 22.0
    heat_away: 18.0
    heat_antifreeze: 10.0

    cool_day: 24.0
    cool_night: 24.0
    cool_away: 28.0

    # FAST devices follow room thermostat demand.
    # A climate entity may appear in both lists and becomes heat_cool.
    fast_heat: >-
      switch.living_room_radiator,
      climate.living_room_ac

    fast_cool: >-
      climate.living_room_ac

    # SLOW accepts local climate thermostats only.
    # All SLOW thermostats in this room use the separate floor/comfort target.
    slow_heat: >-
      climate.living_room_floor

    slow_target: 27.0

    humidity_mode: dehumidifier
    humidity_target: 50
    humidity_actuator: switch.living_room_dehumidifier

telemetry_enabled: false
log_level: info
