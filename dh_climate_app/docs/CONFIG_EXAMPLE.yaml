# Пример options DigitalHouses Climate App.
#
# Списки сущностей задаются через запятую, потому что схема конфигурации
# Home Assistant App поддерживает ограниченную глубину вложенности.
# Где это указано, порядок определяет приоритет.

temperature_hysteresis: 0.5
humidity_hysteresis: 3.0

night_mode: input_boolean.night_mode
we_at_home: input_boolean.we_at_home

# Сезонные пороги: initial HEAT 10 °C, COOL 25 °C, затем SQLite/MQTT.
# RAW-защита реверсивного обогрева кондиционером: −10 °C, фиксирована в коде.

# Упорядоченная priority-цепочка: используется первый текущий валидный источник.
# sensor.* читается из numeric state; weather.* — из текущего атрибута temperature.
# Переключения источника журналируются и публикуются как machine Event.
outdoor_temperature_sources: >-
  sensor.outdoor_temperature,
  weather.primary_provider,
  weather.forecast_home_assistant

# Приоритет влажности независим от приоритета температуры.
# Для weather.* используется текущий атрибут humidity.
outdoor_humidity_sources: >-
  sensor.outdoor_humidity,
  weather.forecast_home_assistant

rooms:
  - id: living_room
    name: Гостиная

    # Несколько комнатных датчиков температуры усредняются.
    temperature_sensors: >-
      sensor.living_room_temperature

    humidity_sensors: >-
      sensor.living_room_humidity

    # Опциональные оконные контакты. Любой открытый контакт делает window state комнаты open.
    window_sensors: >-
      binary_sensor.living_room_window

    # Только перечисленные тепловые устройства принудительно выключаются
    # при открытом окне.
    window_off_devices: >-
      climate.living_room_ac

    # Day/Night/Away/Antifreeze настроены через HA, хранятся в SQLite.
    # FAST-устройства следуют demand комнатного термостата.
    # Одна climate entity может присутствовать в обоих списках и тогда
    # считается heat_cool.
    fast_heat: >-
      switch.living_room_radiator,
      climate.living_room_ac

    fast_cool: >-
      climate.living_room_ac

    # SLOW принимает только локальные climate-термостаты.
    # Все SLOW-термостаты комнаты используют отдельный floor/comfort target.
    # По продуктовому манифесту slow_target в дальнейшем должен стать
    # persisted HA config entity, а не operational YAML-параметром.
    slow_heat: >-
      climate.living_room_floor

    slow_target: 27.0

    humidity_mode: dehumidifier
    humidity_actuator: switch.living_room_dehumidifier

telemetry_enabled: false
log_level: info
