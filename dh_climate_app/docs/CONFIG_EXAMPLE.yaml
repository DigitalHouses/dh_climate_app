# DH Climate App 0.2.0 — шаблон Supervisor options (НЕ реальные entity_id)
# В YAML только физические привязки. Оперативные targets настраиваются через MQTT.
night_mode: input_boolean.night_mode
we_at_home: input_boolean.we_at_home
heating_source: central_heating
vrf: 'on'

outdoor:
  temperature_sources:
    - weather.forecast_home_assistant
    - sensor.outdoor_fallback
  humidity_sources:
    - weather.forecast_home_assistant
    - sensor.outdoor_humidity

rooms:
  - id: livingroom
    name: Гостиная
    temperature_sensors:
      - sensor.livingroom_temperature
    humidity_sensors:
      - sensor.livingroom_humidity
    window_sensors:
      - binary_sensor.livingroom_window
    humidity_mode: 'off'
    devices:
      - entity: climate.livingroom_radiator
        role: fast_heat
        device_type: hardware
        resource: home_heating
      - entity: switch.floor_valve
        role: slow_heat
        device_type: virtual
        actuator: normal_closed
        # Если не указан датчик стяжки, OPEN в HEAT определяется ЯВНО.
        screed_sensor_unavailable: open
        resource: home_heating

  - id: bedroom
    name: Спальня
    temperature_sensors:
      - sensor.bedroom_temperature
    humidity_sensors: []
    window_sensors:
      - binary_sensor.bedroom_window
    humidity_mode: 'off'
    devices:
      - entity: climate.bedroom_vrf
        role: fast_heat
        device_type: hardware
        reversible: true
        resource: vrf

# Не добавляйте блок resources для несуществующих или неподключённых датчиков.
resources:
  - id: central_heating
    status: binary_sensor.central_heating_supply_available
  - id: vrf
    compressor: binary_sensor.vrf_compressor_running
    fault: binary_sensor.vrf_alarm
    restriction: sensor.vrf_restriction
pumps:
  - id: pump1
    name: Циркуляционный насос
    state: switch.heating_pump
    power: sensor.heating_pump_power
circuits:
  - id: supply
    name: Подача
    temperature: sensor.central_supply_temperature
    pressure: sensor.central_supply_pressure

telemetry_enabled: false
log_level: info
