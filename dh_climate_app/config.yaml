name: DigitalHouses Climate App
version: 0.1.33
slug: dh_climate_app
description: Whole-house climate logic with room thermostats and direct Home Assistant device control.
url: https://github.com/DigitalHouses/dh_climate_app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
homeassistant_api: true
hassio_api: true
services:
  - mqtt:need
options:
  night_mode: ""
  we_at_home: ""
  outdoor:
    temperature_sources: []
    humidity_sources: []
  rooms: []
  resources: []
  pumps: []
  circuits: []
  # heating_source / vrf are selected explicitly for each installation.
  telemetry_enabled: false
  log_level: info
schema:
  night_mode: str
  we_at_home: str
  outdoor:
    temperature_sources:
      - str
    humidity_sources:
      - str
  rooms:
    - id: str
      name: str
      temperature_sensors:
        - str
      humidity_sensors:
        - "str?"
      window_sensors:
        - "str?"
      humidity_mode: "list(off|humidifier|dehumidifier)?"
      humidity_actuator: "str?"
      devices:
        - entity: str
          role: list(slow_heat|fast_heat|fast_cool)
          device_type: list(virtual|hardware)
          resource: "list(home_heating|vrf|independent)?"
          screed_sensor_unavailable: "list(open|closed)?"
          actuator: "list(normal_open|normal_closed)?"
          temperature_sensor: "str?"
          reversible: "bool?"
  heating_source: "list(boiler|central_heating)?"
  vrf: "list(on|off)?"
  resources:
    - id: list(boiler|central_heating|vrf)
      status: "str?"
      dhw: "str?"
      target: "str?"
      aggregator: "str?"
      compressor: "str?"
      fault: "str?"
      restriction: "str?"
  pumps:
    - id: str
      name: str
      state: "str?"
      power: "str?"
      rpm: "str?"
  circuits:
    - id: str
      name: str
      temperature: "str?"
      pressure: "str?"
  telemetry_enabled: bool
  log_level: list(debug|info|warning|error)
