name: DigitalHouses Climate App
version: 0.1.33
slug: dh_climate_app
description: Whole-house climate logic with room thermostats and direct Home Assistant device control.
url: https://github.com/DigitalHouses/dh_climate_app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
homeassistant_api: true
hassio_api: true
services:
  - mqtt:need
options:
  night_mode: ""
  we_at_home: ""
  outdoor:
    temperature_sources: []
    humidity_sources: []
  rooms: []
  actual_demand:
    heat: ""
    cool: ""
  telemetry_enabled: false
  log_level: info
schema:
  night_mode: str
  we_at_home: str
  outdoor:
    temperature_sources:
      - str
    humidity_sources:
      - str
  rooms:
    - id: str
      name: str
      temperature_sensors:
        - str
      humidity_sensors:
        - "str?"
      window_sensors:
        - "str?"
      humidity_mode: "list(off|humidifier|dehumidifier)?"
      humidity_actuator: "str?"
      devices:
        - entity: str
          role: list(slow_heat|fast_heat|fast_cool)
          control: list(app|device)
          actuator: "list(normal_open|normal_closed)?"
          temperature_sensor: "str?"
          reversible: "bool?"
  actual_demand:
    heat: "str?"
    cool: "str?"
  telemetry_enabled: bool
  log_level: list(debug|info|warning|error)
