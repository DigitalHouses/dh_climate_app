name: DigitalHouses Climate App
version: 0.1.29
slug: dh_climate_app
description: Whole-house climate logic with room thermostats and direct Home Assistant device control.
url: https://github.com/DigitalHouses/dh_climate_app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
homeassistant_api: true
hassio_api: true
services:
  - mqtt:need
options:
  temperature_hysteresis: 0.5
  humidity_hysteresis: 3.0
  night_mode: ""
  we_at_home: ""
  outdoor_temperature_sources: ""
  outdoor_humidity_sources: ""
  rooms: []
  telemetry_enabled: false
  log_level: info
schema:
  temperature_hysteresis: float(0,5)
  humidity_hysteresis: float(0,25)
  night_mode: str
  we_at_home: str
  outdoor_temperature_sources: str
  outdoor_humidity_sources: str
  rooms:
    - id: str
      name: str
      temperature_sensors: str
      humidity_sensors: "str?"
      window_sensors: "str?"
      window_off_devices: "str?"
      fast_heat: "str?"
      fast_cool: "str?"
      slow_heat: "str?"
      slow_target: "float?"
      humidity_mode: "list(off|humidifier|dehumidifier)?"
      humidity_actuator: "str?"
  telemetry_enabled: bool
  log_level: list(debug|info|warning|error)
