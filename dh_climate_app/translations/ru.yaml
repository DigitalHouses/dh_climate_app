configuration:
  temperature_hysteresis:
    name: Гистерезис температуры
    description: Единый общедомовой гистерезис в °C для выбора сезона и комнатных термостатов.
  humidity_hysteresis:
    name: Гистерезис влажности
    description: Общедомовой гистерезис относительной влажности в процентных пунктах.
  night_mode:
    name: Сущность ночного режима
    description: Необязательный input_boolean.* или binary_sensor.*. Оставьте пустым, если ночной профиль не используется.
  we_at_home:
    name: Сущность присутствия дома
    description: Необязательный input_boolean.* или binary_sensor.*. Недоступная настроенная сущность считается режимом away.
  outdoor_temperature_sources:
    name: Источники уличной температуры
    description: sensor.* или weather.* через запятую в порядке приоритета. Для weather.* используется текущий атрибут temperature.
  outdoor_humidity_sources:
    name: Источники уличной влажности
    description: sensor.* или weather.* через запятую в независимом порядке приоритета. Для weather.* используется текущий атрибут humidity.
  rooms:
    name: Комнаты
    description: Комнатные датчики, термостаты и привязки исполнительных устройств.
    fields:
      id:
        name: ID комнаты
        description: Стабильный ID строчными буквами для MQTT, например living_room.
      name:
        name: Название комнаты
        description: Название MQTT-устройства комнаты в Home Assistant.
      temperature_sensors:
        name: Датчики температуры
        description: sensor.* через запятую. Доступные значения усредняются.
      humidity_sensors:
        name: Датчики влажности
        description: sensor.* через запятую. Доступные значения усредняются. Можно оставить пустым.
      window_sensors:
        name: Датчики окон
        description: binary_sensor.* через запятую. Если открыт хотя бы один контакт, окно комнаты считается открытым.
      window_off_devices:
        name: Отключать при открытом окне
        description: Исполнительные устройства этой комнаты через запятую, которые нужно принудительно выключать при открытом окне.
      fast_heat:
        name: FAST отопление
        description: switch.* или climate.* через запятую, которые следуют запросу комнаты на отопление.
      fast_cool:
        name: FAST охлаждение
        description: switch.* или climate.* через запятую, которые следуют запросу комнаты на охлаждение.
      slow_heat:
        name: SLOW термостаты
        description: climate.* через запятую с собственным локальным датчиком пола/стяжки.
      slow_target:
        name: Уставка SLOW
        description: Целевая температура пола/комфорта для SLOW термостатов в отопительный сезон.
      humidity_mode:
        name: Управление влажностью
        description: off, humidifier или dehumidifier.
      humidity_actuator:
        name: Исполнитель влажности
        description: switch.* или humidifier.*. Оставьте пустым при humidity_mode=off.
  telemetry_enabled:
    name: Телеметрия использования
    description: Отправлять минимальную псевдонимную телеметрию DigitalHouses. По умолчанию выключено.
  log_level:
    name: Уровень логов
    description: Подробность журналирования приложения.
