name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./dh_climate_app
      - run: python -m compileall -q dh_climate_app/src dh_climate_app/tests
      - run: python -m unittest discover -s dh_climate_app/tests -v
      - run: bash -n dh_climate_app/rootfs/run.sh
      - run: docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION=0.1.0 ./dh_climate_app
