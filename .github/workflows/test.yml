name: test

on:
  push:
    branches: [main, experimental]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./dh_climate_app pyyaml
      - run: python -m compileall -q dh_climate_app/src dh_climate_app/tests
      - run: python -m unittest discover -s dh_climate_app/tests -v
      - name: Validate YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          for path in (
              pathlib.Path("dh_climate_app/config.yaml"),
              pathlib.Path("dh_climate_app/translations/en.yaml"),
              pathlib.Path("dh_climate_app/translations/ru.yaml"),
          ):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML OK: {path}")
          PY
      - run: bash -n dh_climate_app/rootfs/run.sh
      - run: bash -n dh_climate_app/tools/haos_live_acceptance.sh
      - name: Build HAOS image
        run: |
          VERSION="$(awk '$1 == "version:" {print $2; exit}' dh_climate_app/config.yaml)"
          docker build --build-arg BUILD_VERSION="$VERSION" --build-arg BUILD_ARCH=amd64 ./dh_climate_app
