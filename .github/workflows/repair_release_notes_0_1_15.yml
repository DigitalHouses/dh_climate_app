name: repair release notes 0.1.15

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair_release_notes_0_1_15.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build corrected release notes
        shell: bash
        env:
          VERSION: "0.1.15"
          TAG: "digitalhouses_climate_app-v0.1.15"
          RELEASE_SHA: "cfbcc28b856a6d34f6e5892fa7b6aa9f477334a3"
          IMAGE_DIGEST: "sha256:2ce86ebdd1a788ca3fbd9357ec0ae4ddef66818008c684559a58192770481997"
          RELEASE_RUN_ID: "36267401820"
        run: |
          set -Eeuo pipefail

          awk -v version="${VERSION}" '
            $0 ~ "^## " version "([[:space:]]|$)" {inside=1; next}
            inside && /^## / {exit}
            inside {print}
          ' dh_climate_app/CHANGELOG.md > release-notes.md

          {
            echo
            echo "### Artifact provenance"
            echo
            printf -- '- Tag: `%s`\n' "${TAG}"
            printf -- '- Commit: `%s`\n' "${RELEASE_SHA}"
            printf -- '- Image: `ghcr.io/digitalhouses/digitalhouses_climate_app:%s`\n' "${VERSION}"
            printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}"
            printf -- '- CI: `%s/%s/actions/runs/%s`\n'               "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${RELEASE_RUN_ID}"
          } >> release-notes.md

      - name: Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "digitalhouses_climate_app-v0.1.15"
          IMAGE_DIGEST: "sha256:2ce86ebdd1a788ca3fbd9357ec0ae4ddef66818008c684559a58192770481997"
        run: |
          set -Eeuo pipefail

          gh release edit "${TAG}" --notes-file release-notes.md

          BODY="$(gh release view "${TAG}" --json body --jq .body)"
          grep -F -- "${IMAGE_DIGEST}" <<<"${BODY}" >/dev/null
          grep -F -- "cfbcc28b856a6d34f6e5892fa7b6aa9f477334a3" <<<"${BODY}" >/dev/null
