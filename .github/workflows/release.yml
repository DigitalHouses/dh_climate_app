name: release

on:
  push:
    tags:
      - "digitalhouses_climate_app-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          CONFIG_VERSION="$(awk '/^version:/ {print $2; exit}' config.yaml | tr -d '"')"
          if [[ -z "${CONFIG_VERSION}" ]]; then
            echo "config.yaml version is missing" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            EXPECTED_TAG="digitalhouses_climate_app-v${CONFIG_VERSION}"
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match ${EXPECTED_TAG}" >&2
              exit 1
            fi
          fi

          echo "version=${CONFIG_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/digitalhouses/digitalhouses-climate-app:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
