name: release

on:
  push:
    tags:
      - "digitalhouses_climate_app-v*"
    branches:
      - main
    paths:
      - "dh_climate_app/RELEASE"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          CONFIG="dh_climate_app/config.yaml"
          CHANGELOG="dh_climate_app/CHANGELOG.md"
          RELEASE_MARKER="dh_climate_app/RELEASE"

          CONFIG_VERSION="$(awk '/^version:/ {print $2; exit}' "${CONFIG}" | tr -d '"')"
          if [[ -z "${CONFIG_VERSION}" ]]; then
            echo "config.yaml version is missing" >&2
            exit 1
          fi

          EXPECTED_TAG="digitalhouses_climate_app-v${CONFIG_VERSION}"

          if ! grep -Eq "^##[[:space:]]+${CONFIG_VERSION}[[:space:]]+—[[:space:]]+[0-9]{4}-[0-9]{2}-[0-9]{2}$" "${CHANGELOG}"; then
            echo "CHANGELOG must contain a dated release heading for ${CONFIG_VERSION}" >&2
            exit 1
          fi

          git fetch --tags origin main

          case "${GITHUB_REF_TYPE}" in
            tag)
              if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
                echo "Tag ${GITHUB_REF_NAME} does not match ${EXPECTED_TAG}" >&2
                exit 1
              fi

              RELEASE_SHA="$(git rev-parse "${EXPECTED_TAG}^{commit}")"
              if ! git merge-base --is-ancestor "${RELEASE_SHA}" "origin/main"; then
                echo "Release tag must point to a commit on main" >&2
                exit 1
              fi
              ;;

            branch)
              if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
                echo "Release marker may run only from main" >&2
                exit 1
              fi

              if [[ ! -f "${RELEASE_MARKER}" ]]; then
                echo "Release marker is missing" >&2
                exit 1
              fi

              MARKER="$(tr -d '[:space:]' < "${RELEASE_MARKER}")"
              if [[ "${MARKER}" != "${EXPECTED_TAG}" ]]; then
                echo "Release marker ${MARKER} does not match ${EXPECTED_TAG}" >&2
                exit 1
              fi

              if [[ "${GITHUB_SHA}" != "$(git rev-parse origin/main)" ]]; then
                echo "Release marker must point at current origin/main" >&2
                exit 1
              fi

              if git ls-remote --exit-code --tags origin "refs/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
                echo "Release tag already exists: ${EXPECTED_TAG}" >&2
                exit 1
              fi

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${EXPECTED_TAG}" "${GITHUB_SHA}" -m "DigitalHouses Climate App v${CONFIG_VERSION}"
              git push origin "refs/tags/${EXPECTED_TAG}"

              RELEASE_SHA="${GITHUB_SHA}"
              ;;

            *)
              echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
              exit 1
              ;;
          esac

          echo "version=${CONFIG_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${EXPECTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable destination is unused
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${TAG}" >&2
            exit 1
          fi

          if docker buildx imagetools inspect             "ghcr.io/digitalhouses/digitalhouses_climate_app:${VERSION}"             >/dev/null 2>&1; then
            echo "Immutable GHCR tag already exists: ${VERSION}" >&2
            exit 1
          fi

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./dh_climate_app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/digitalhouses/digitalhouses_climate_app:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.release_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          awk -v version="${VERSION}" '
            $0 ~ "^## " version "([[:space:]]|$)" {inside=1; next}
            inside && /^## / {exit}
            inside {print}
          ' dh_climate_app/CHANGELOG.md > release-notes.md

          {
            echo
            echo "### Artifact provenance"
            echo
            echo "- Tag: `${TAG}`"
            echo "- Commit: `${RELEASE_SHA}`"
            echo "- Image: `ghcr.io/digitalhouses/digitalhouses_climate_app:${VERSION}`"
            echo "- Digest: `${IMAGE_DIGEST}`"
            echo "- CI: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`"
          } >> release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          gh release create "${TAG}"             --verify-tag             --title "DigitalHouses Climate App v${VERSION}"             --notes-file release-notes.md
